name: Make master stills

on:
  workflow_dispatch:
    inputs:
      episode:
        default: "episodes/ep01_stolen_king.json"
      only:
        description: "Only these stills (comma list), empty = all"
        default: ""

permissions:
  contents: write

jobs:
  stills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
        run: python -u pipeline/make_stills.py "${{ inputs.episode }}" out/stills
